[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evo-scry"
version = "2.1.0"
description = "MCP server for internet search via DuckDuckGo, Bing, Brave, and Google HTML scraping"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
pdf = [
    "pymupdf>=1.24",
]

[project.scripts]
evo-scry = "evoscry.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoscry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
